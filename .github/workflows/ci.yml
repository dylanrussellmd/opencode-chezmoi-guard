name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: setup node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Pinned, checksum-verified chezmoi for the real-chezmoi integration smoke.
      - name: install chezmoi
        env:
          CHEZMOI_VERSION: 2.73.0
          CHEZMOI_SHA256: b597729b687af4488a848240134cb633de8ca0f04e0d26d48f400ee2ac338ffa
        run: |
          archive="chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/$archive"
          echo "${CHEZMOI_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" chezmoi
          sudo install "$RUNNER_TEMP/chezmoi" /usr/local/bin/chezmoi
          chezmoi --version

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

      - name: test
        run: npm test

      - name: integration (real chezmoi, mocked host)
        run: node scripts/integration-smoke.mjs

      - name: pack (dry-run, verify publish artifact)
        run: npm pack --dry-run
